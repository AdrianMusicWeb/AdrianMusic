<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Music | Sitio Oficial</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Outfit & Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#1c1917',        /* Piedra / Tierra oscuro elegante */
                            card: '#292524',        /* Tarjeta piedra oscuro */
                            turquoise: '#14b8a6',   /* Turquesa vibrante */
                            turquoiseLight: '#2dd4bf',
                            earth: '#d97706',       /* Acento cálido tierra */
                            sand: '#f5f5f4',        /* Texto neutro claro */
                        }
                    },
                    boxShadow: {
                        'neon-turquoise': '0 0 25px -5px rgba(20, 184, 166, 0.35)',
                        'neon-earth': '0 0 25px -5px rgba(217, 119, 6, 0.35)',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS para animaciones y efectos -->
    <style>
        body {
            background-color: #1c1917;
            color: #f5f5f4;
            top: 0px !important;
        }

        .gradient-text {
            background: linear-gradient(135deg, #14b8a6 0%, #2dd4bf 50%, #f5f5f4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-border {
            position: relative;
            background: #292524;
            border-radius: 1.25rem;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 1.3rem;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.5), rgba(217, 119, 6, 0.3));
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0.6;
        }

        .gradient-border:hover::before {
            opacity: 1;
        }

        /* Video de Fondo Tenue y Difuminado con Opacidad al 0.65 */
        .hero-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.65;
            filter: blur(1px);
        }

        /* Esferas de luz ambiental */
        .glow-sphere-1 {
            position: absolute;
            top: 5%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        .glow-sphere-2 {
            position: absolute;
            top: 55%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        /* Transición suave para separar las letras de la portada al bajar */
        .split-title-part {
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
            will-change: transform, opacity;
        }

        /* Ocultar elementos nativos de Google Translate */
        .goog-te-banner-frame, .skiptranslate, #google_translate_element {
            display: none !important;
        }
    </style>
</head>

    <div class="glow-sphere-1"></div>

                        <button onclick="translateLanguage('it', 'Italiano')" class="w-full text-left px-4 py-2 text-xs text-stone-200 hover:bg-stone-700 hover:text-brand-turquoise flex items-center justify-between">

            </div>

        </div>

            <a href="#redes" onclick="toggleMenu()" class="hover:text-brand-turquoise py-1 border-b border-stone-800">Redes Sociales</a>
